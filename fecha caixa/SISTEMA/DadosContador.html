 <!-- ================= DASHBOARD PRINCIPAL ================= -->
    <main class="dashboard-content">

        <!-- O GRANDE CONTAINER ÚNICO (Conforme imagem_f381d2.png) -->
        <div class="container container-unico-glass">
            <form class="formulario-fluxo">
                
                <!-- 1. BLOCO SUPERIOR: 3 caixas de inputs lado a lado -->
                <div class="bloco-inputs-topo">
                    <div class="sub-caixa">
                        <label for="operador"><i class="fa-solid fa-user"></i> Operador do Caixa</label>
                        <input type="text" id="operador" placeholder="Digite seu nome">
                    </div>

                    <div class="sub-caixa">
                        <label for="valor-inicial"><i class="fa-solid fa-vault"></i> Valor de Fundo (R$)</label>
                        <input type="number" id="valor-inicial" step="0.01" placeholder="0,00">
                    </div>

                    <div class="sub-caixa">
                        <label for="nome-empresa"><i class="fa-solid fa-building"></i> Nome da Empresa</label>
                        <input type="text" id="nome-empresa" placeholder="Digite a empresa">
                    </div>
                </div>

                <!-- 2. CAMPO CENTRAL: Observações (A linha intermediária do desenho) -->
                <div class="bloco-observacoes-centro">
                    <label for="observacoes"><i class="fa-solid fa-comment-dots"></i> Observações adicionais turno / caixa</label>
                    <input type="text" id="observacoes" placeholder="Digite notas ou observações importantes aqui se necessário...">
                </div>

                <!-- 3. BLOCO INFERIOR: As 3 caixas de seleção lado a lado -->
                <div class="secao-modalidades">
                    <h3>🏦 Modalidade de Contagem</h3>
                    
                    <div class="opcoes-linha">
                        <!-- Opção Cédulas -->
                        <label class="card-opcao">
                            <input type="radio" name="tipo_contagem" value="cedulas" checked>
                            <div class="card-conteudo">
                                <span class="emoji">💵</span>
                                <div class="info-opcao">
                                    <h4>Apenas Cédulas</h4>
                                    <p>Notas de R$ 2 a R$ 200</p>
                                </div>
                            </div>
                        </label>

                        <!-- Opção Moedas -->
                        <label class="card-opcao">
                            <input type="radio" name="tipo_contagem" value="moedas">
                            <div class="card-conteudo">
                                <span class="emoji">🪙</span>
                                <div class="info-opcao">
                                    <h4>Apenas Moedas</h4>
                                    <p>Moedas de R$ 0,01 a R$ 1,00</p>
                                </div>
                            </div>
                        </label>

                        <!-- Opção Completa -->
                        <label class="card-opcao">
                            <input type="radio" name="tipo_contagem" value="completa">
                            <div class="card-conteudo">
                                <span class="emoji">💰</span>
                                <div class="info-opcao">
                                    <h4>Cédulas + Moedas</h4>
                                    <p>Contagem total do caixa</p>
                                </div>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- 4. BASE DO CONTAINER: Botão Iniciar e Aviso -->
                <div class="bloco-botao-base">
                    <button type="submit" id="btnIniciar" class="btn-iniciar">
                        Iniciar Contagem <i class="fa-solid fa-arrow-right"></i>
                    </button>
                    <p class="nota-privacidade">🔒 As informações são processadas de forma 100% local e segura.</p>
                </div>

            </form>
        </div>

        <div id="mensagemErro" class="mensagem-erro">

        <div class="bloco-botao-base">

        <div id="backdropErro" class="backdrop-erro"></div>

        <div id="mensagemErro" class="mensagem-erro"></div>

    <button 
        type="submit" 
        id="btnIniciar"
        class="btn-iniciar">

        Iniciar Contagem 
        <i class="fa-solid fa-arrow-right"></i>

    </button>

</div>
